e:"Black",hex:"#383a3b"}],storage:[{label:"256GB",add:0},{label:"512GB",add:200}],highlights:["A19 chip","48MP Dual Fusion camera","Up to 30 hours video playback"],accent:"#c8c1d9"},{id:"air",name:"iPhone Air",shortName:"Air",tagline:"Remarkably light on limits.",description:"An impossibly thin profile with the power, display, and battery life to move through a full day.",price:999,badge:"Thinnest iPhone",finishes:[{name:"Sky Blue",hex:"#c2d4df"},{name:"Light Gold",hex:"#ded3bf"},{name:"Cloud White",hex:"#e8e7e2"},{name:"Space Black",hex:"#3d3e40"}],storage:[{label:"256GB",add:0},{label:"512GB",add:200},{label:"1TB",add:400}],highlights:["A19 Pro chip","48MP Fusion camera","All-day battery life"],accent:"#c2d4df"},{id:"16e",name:"iPhone 16e",shortName:"16e",tagline:"The essentials. Beautifully done.",description:"A modern iPhone with impressive battery life, a powerful chip, and an approachable price.",price:599,badge:"Best value",finishes:[{name:"White",hex:"#e5e4df"},{name:"Black",hex:"#3b3c3d"}],storage:[{label:"128GB",add:0},{label:"256GB",add:100},{label:"512GB",add:300}],highlights:["A18 chip","48MP 2-in-1 camera","Up to 26 hours video playback"],accent:"#a9aaa8"}],kj=[{quote:"It keeps up with my camera roll, my calendar, and my very chaotic group chat.",name:"Nia",detail:"Creative producer · 26"},{quote:"The first phone I’ve had that still feels fast at the end of a very long day.",name:"Alex",detail:"Product designer · 29"},{quote:"I take fewer photos now, but somehow love more of them. That’s the upgrade.",name:"Jules",detail:"Weekend filmmaker · 24"}],To=[{id:"create",nav:"Make something",eyebrow:"For the makers",title:"Your ideas don’t have to wait.",body:"Frame the shot, cut the reel, record the voice note, and share it before the moment passes. Powerful creative tools feel immediate, not intimidating.",image:"/images/lifestyle-man.jpg",alt:"A young man taking a photo on a rooftop at golden hour",points:["Pro-level video in your pocket","Fast, fluid edit
